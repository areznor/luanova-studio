<!DOCTYPE html>
<html lang="pt-BR" data-lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sobre · Lua Nova Studio</title>
    <meta name="description" content="Sobre a Lua Nova Studio — missão, visão e contato." />
    <link rel="icon" href="assets/brand/logo-minimalista-lua-nova.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="about">
    <a class="skip-link" href="#conteudo">Skip / Pular</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Lua Nova Studio">
          <img class="brand-logo" src="assets/brand/logo-minimalista-lua-nova.png" alt="" width="42" height="42" />
          <span class="brand-name">Lua Nova Studio</span>
        </a>
        <div class="header-actions">
          <nav class="nav" aria-label="Principal">
            <a href="index.html" data-i18n="ui.navHome">Início</a>
            <a href="sobre.html" aria-current="page" data-i18n="ui.navAbout">Sobre</a>
            <a href="catalogo.html" data-i18n="ui.navCatalog">Catálogo</a>
          </nav>
          <div class="lang-toggle" role="group" aria-label="Idioma / Language">
            <button type="button" data-lang="pt" aria-pressed="true">PT</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main id="conteudo" class="wrap page-hero">
      <a class="crumb" href="index.html" data-i18n="ui.backHome">← Voltar ao início</a>
      <div class="about-mark-frame">
        <img class="about-mark about-mark--minimal" src="assets/brand/logo-minimalista-lua-nova.png" alt="Lua Nova Studio" width="160" height="160" />
      </div>
      <h1 class="book-title" data-i18n="ui.aboutTitle">Sobre a Lua Nova Studio</h1>
      <p class="book-subtitle" data-i18n="site.tagline">Livros que iluminam novos caminhos</p>

      <div class="about-grid">
        <article class="about-block">
          <h2 data-i18n="ui.missionTitle">Missão</h2>
          <div class="prose">
            <p data-i18n="about.mission"></p>
          </div>
        </article>
        <article class="about-block">
          <h2 data-i18n="ui.visionTitle">Visão</h2>
          <div class="prose">
            <p data-i18n="about.vision"></p>
          </div>
        </article>
      </div>

      <article class="about-block" style="margin-top: 1.5rem">
        <h2 data-i18n="ui.eventsTitle">Próximos eventos</h2>
        <div class="prose">
          <p data-i18n="about.eventsLead"></p>
          <p class="events-empty" data-i18n="about.eventsEmpty"></p>
        </div>
      </article>

      <article class="about-block" style="margin-top: 1.5rem">
        <h2 data-i18n="ui.contactTitle">Contato</h2>
        <div data-contact></div>
      </article>

      <p class="note" data-i18n="about.note"></p>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <div class="footer-brand">
          <img src="assets/brand/logo-minimalista-lua-nova.png" alt="" width="36" height="36" />
          <p class="footer-copy" data-i18n="ui.footerRights">Lua Nova Studio - {year} - Todos os direitos reservados</p>
        </div>
        <div class="footer-links">
          <a href="autor.html?id=amanda-reznor">Amanda Reznor</a>
          <a href="https://www.amazon.com.br/s?k=Amanda+Reznor" target="_blank" rel="noopener noreferrer">Amazon / KDP</a>
        </div>
      </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/carousel.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
